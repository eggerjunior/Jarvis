name: Jarvis
options:
  bundleIdPrefix: br.app.egger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16"
settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: E743636TCJ
    GIT_COMMIT: dev
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Para conversar por voz com o Jarvis."
        NSSpeechRecognitionUsageDescription: "Para transcrever seus comandos de voz."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        GitCommit: "$(GIT_COMMIT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: br.app.egger.jarvis
      INFOPLIST_FILE: Sources/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: JarvisWidgets
        embed: true
  JarvisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: br.app.egger.jarvis.widgets
      INFOPLIST_FILE: Widgets/Info.plist
